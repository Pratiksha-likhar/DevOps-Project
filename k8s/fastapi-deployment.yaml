apiVersion: apps/v1
kind: Deployment

metadata:
  name: fastapi

spec:

  replicas: 2

  selector:
    matchLabels:
      app: fastapi

  template:

    metadata:
      labels:
        app: fastapi

    spec:

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000

      containers:

        - name: fastapi

          image: cammey20/vindiafs

          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          env:

            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: employee-app-config
                  key: APP_NAME

            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: employee-app-config
                  key: APP_ENV

            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: employee-app-config
                  key: MYSQL_HOST

            - name: MYSQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: employee-app-config
                  key: MYSQL_PORT

            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: employee-app-config
                  key: MYSQL_DATABASE

            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD

          securityContext:

            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL

          resources:

            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:

            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:

            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 20
            periodSeconds: 20